name: Update transactions

on:
  schedule:
    # UTC 기준입니다. 01:23 UTC = 한국시간 10:23, 10:23 UTC = 한국시간 19:23
    - cron: "23 1,10 * * *"
  workflow_dispatch:
    inputs:
      since:
        description: "처음부터 다시 수집할 시작 연월 (예: 200801). 비워두면 최근 3개월만 갱신"
        required: false
        default: ""

permissions:
  contents: write   # 갱신된 JSON 을 자동 커밋하기 위해 필요

concurrency:
  group: update-transactions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect transactions
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          SINCE: ${{ inputs.since }}
        run: |
          if [ -n "$SINCE" ]; then
            python scripts/collect.py --since "$SINCE"
          else
            python scripts/collect.py --months 3
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "변경 없음 - 커밋하지 않습니다"
          else
            git commit -m "data: update transactions"
            git push
          fi
